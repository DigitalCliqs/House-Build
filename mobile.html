<style>
:root{--glass:rgba(27,24,21,.62);--line:rgba(255,255,255,.14);--cream:#ead3ad;--ink:#241f19}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#11100f;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.22)}button{font:inherit;color:inherit}#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#11100f;font-size:14px;letter-spacing:.02em;padding:24px;text-align:center}.hidden{display:none!important}#topbar{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none}.brand{pointer-events:auto;min-width:0;flex:1;padding:11px 13px;border-radius:14px}.brand strong{display:block;font-family:Georgia,serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;margin-top:3px;font-size:10px;color:#eadfce;opacity:.84}.chip{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);border-radius:12px;min-height:48px;padding:0 12px;font-size:11px;font-weight:700}.chip b{display:block;font-size:9px;opacity:.58;font-weight:600;margin-bottom:2px}.chip span{white-space:nowrap}#status{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:18;padding:6px 10px;border-radius:999px;background:rgba(20,18,16,.5);font-size:11px;pointer-events:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#roomstrip{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:25;display:flex;gap:6px;padding:6px;border-radius:15px;overflow-x:auto;scrollbar-width:none}.roomstrip::-webkit-scrollbar{display:none}.roomstrip button{flex:0 0 auto;min-width:86px;height:60px;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:11px;font-size:12px}.roomstrip button small{display:block;font-size:9px;opacity:.58;letter-spacing:.08em;margin-bottom:3px}.roomstrip button.active{background:var(--cream);color:var(--ink)}#joystick{position:fixed;left:18px;bottom:92px;z-index:24;width:92px;height:92px;border-radius:50%;background:rgba(22,20,18,.34);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);touch-action:none}#joystick:after{content:'';position:absolute;inset:28px;border:1px solid rgba(255,255,255,.12);border-radius:50%}#joystick-knob{position:absolute;left:31px;top:31px;width:30px;height:30px;border-radius:50%;background:rgba(245,239,230,.92);box-shadow:0 5px 16px rgba(0,0,0,.28)}#actions{position:fixed;right:14px;bottom:96px;z-index:24;display:grid;gap:7px}#actions button{min-width:84px;height:42px;border:1px solid var(--line);background:rgba(27,24,21,.66);border-radius:11px;backdrop-filter:blur(12px);font-size:11px;font-weight:700}#hint{position:fixed;left:50%;bottom:101px;transform:translateX(-50%);z-index:18;font-size:10px;background:rgba(20,18,16,.42);padding:5px 8px;border-radius:8px;pointer-events:none;white-space:nowrap}#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:none;align-items:flex-end;touch-action:none}#sheet.open{display:flex}.sheet-card{width:100%;max-height:70dvh;overflow:auto;border-radius:22px 22px 0 0;background:rgba(25,23,21,.96);border-top:1px solid var(--line);padding:16px 16px calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}.grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto 12px}.sheet-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-title strong{font-family:Georgia,serif;font-size:20px}.sheet-title button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;width:42px;height:38px}.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet-grid button{min-height:50px;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:12px;font-size:12px}.sheet-grid button.active{background:var(--cream);color:var(--ink)}@media(max-width:420px){.brand span{display:none}.brand strong{font-size:16px}.chip{padding:0 9px;min-height:44px}.chip b{display:none}#status{top:76px}#hint{display:none}}
</style>

<div id="app"></div><div id="loading">Starting mobile renderer…</div>
