<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d1014"><title>Anamarija EuroMax · 360 Tour</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1014;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}button{font:inherit}.stage{position:fixed;inset:0;overflow:hidden;background:#161b20;touch-action:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.14),transparent 30%,transparent 72%,rgba(0,0,0,.28));z-index:2}.top{position:fixed;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;z-index:30;pointer-events:none}.brand{pointer-events:auto;padding:12px 14px;border-radius:14px;background:rgba(14,17,21,.54);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);box-shadow:0 10px 34px rgba(0,0,0,.22)}#projectTitle{font-size:18px;font-weight:780;letter-spacing:-.02em}#projectSub{margin-top:2px;font-size:11px;opacity:.72}.actions{margin-left:auto;display:flex;gap:7px;pointer-events:auto}.actions button,.dock button,.drawer button,.modal button{border:1px solid rgba(255,255,255,.14);background:rgba(14,17,21,.68);color:#fff;border-radius:12px;min-height:44px;padding:9px 12px;font-weight:750;backdrop-filter:blur(14px)}#roomTitle{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);z-index:26;padding:9px 12px;border-radius:11px;background:rgba(14,17,21,.42);font-size:13px;font-weight:740;backdrop-filter:blur(12px);pointer-events:none}.hotspots{position:fixed;inset:0;z-index:12;pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:1px solid rgba(25 ard{position:relative;width:min(1000px,96vw);max-height:92vh;padding:10px;border-radius:16px;background:#15191e;border:1px solid rgba(255,255,255,.13);box-shadow:0 22px 80px rgba(0,0,0,.5)}.modal img{display:block;max-width:100%;max-height:calc(92vh - 20px);margin:auto;border-radius:10px}.modal button{position:absolute;right:18px;top:18px;z-index:2;min-width:44px}.accessibility .hotspot{font-size:13px;min-height:44px;padding:10px 14px}.accessibility .dock button,.accessibility .actions button{min-height:50px;font-size:15px}@media(max-width:700px){.top{left:8px;right:8px;top:max(8px,env(safe-area-inset-top))}.brand{padding:8px 10px;max-width:48vw}.brand #projectTitle{font-size:14px}.brand #projectSub{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{gap:4px}.actions button{min-height:40px;padding:7px 8px;font-size:11px}.actions #fullBtn{display:none}#roomTitle{top:auto;bottom:max(74px,calc(env(safe-area-inset-bottom) + 70px));font-size:11px}.dock{left:8px;right:8px;transform:none;justify-content:center;bottom:max(8px,env(safe-area-inset-bottom));padding:6px}.dock button{flex:1;min-width:0;max-width:140px;font-size:13px;min-height:46px}.hotspot{font-size:10px;padding:7px 9px}.room-menu{grid-template-columns:1fr}.asset{font-size:9px;right:8px;bottom:128px;max-width:80vw}}</style></head><body><div id="stage" class="stage"><div class="shade"></div></div><div class="top"><div class="brand"><div id="projectTitle">Anamarija EuroMax</div><div id="projectSub">~200 m² · premium · accessible · low-energy home</div></div><div class="actions"><button id="planBtn">Plan</button><button id="designBtn" onclick="location.href='./design.html'">Design</button><button id="fullBtn">Fullscreen</button></div></div><div id="roomTitle">Entrance</div><div id="hotspots" class="hotspots"></div><div class="dock"><button id="menuBtn">Rooms</button><button id="accessBtn">Wheelchair view</button></div><div id="assetState" class="asset" data-ok="0">Loading six-axis pano
