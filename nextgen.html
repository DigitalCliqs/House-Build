<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anamarija Next-Gen Walkthrough</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:fixed;left:16px;top:16px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
    button,.pill{border:1px solid rgba(255,255,255,.22);background:rgba(15,18,20,.76);color:#fff;border-radius:999px;padding:10px 14px;backdrop-filter:blur(12px);font-size:14px}
    button{cursor:pointer}
    #status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;background:rgba(15,18,20,.72);color:#fff;padding:9px 13px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis}
    #note{position:fixed;right:16px;top:16px;z-index:10;max-width:310px;background:rgba(15,18,20,.72);color:#e9ecef;padding:12px 14px;border-radius:14px;font-size:12px;line-height:1.4;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
    #mobile-controls{display:none;position:fixed;left:14px;bottom:18px;z-index:12;width:150px;height:150px;pointer-events:none}
    #mobile-controls button{position:absolute;width:56px;height:56px;padding:0;border-radius:50%;font-size:24px;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
    #move-up{left:47px;top:0}#move-left{left:0;top:47px}#move-right{right:0;top:47px}#move-down{left:47px;bottom:0}
    #look-hint{display:none;position:fixed;right:14px;bottom:24px;z-index:12;background:rgba(15,18,20,.62);color:#fff;padding:9px 12px;border-radius:999px;font-size:12px;pointer-events:none}
    body.mobile-active #mobile-controls,body.mobile-active #look-hint{display:block}
    @media(max-width:700px){#note{top:auto;right:12px;bottom:190px;left:12px;max-width:none}#hud{left:12px;top:12px}#status{bottom:8px}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <button id="enter">Enter walkthrough</button>
    <button id="mode">Walking view</button>
    <span id="asset-state" class="pill">loading assets…</span>
  </div>
  <div id="note">Next-generation staging build. Architectural shell, collision and camera pipeline are active. Production GLBs, PBR textures and HDRI assets are still being populated, so this is not the final photoreal presentation.</div>
  <div id="mobile-controls" aria-label="Movement controls">
    <button id="move-up" aria-label="Move forward">▲</button>
    <button id="move-left" aria-label="Move left">◀</button>
    <button id="move-right" aria-label="Move right">▶</button>
    <button id="move-down" aria-label="Move backward">▼</button>
  </div>
  <div id="look-hint">Drag scene to look around</div>
  <div id="status">Initializing…</div>
  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('status');
      if (status) status.textContent = `Startup error: ${event.message || 'unknown error'}`;
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('status');
      if (status) status.textContent = `Startup error: ${event.reason?.message || event.reason || 'unknown error'}`;
    });
  </script>
  <script type="module" src="./src/nextgen-app-v1.js?v=4"></script>
</body>
</html>
