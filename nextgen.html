<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Anamarija Next-Gen Walkthrough</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:fixed;left:16px;top:16px;z-index:10;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
    button,.pill{border:1px solid rgba(255,255,255,.20);background:rgba(15,18,20,.68);color:#fff;border-radius:999px;padding:10px 14px;backdrop-filter:blur(12px);font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
    button{cursor:pointer}
    #status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;background:rgba(15,18,20,.66);color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(10px)}
    #note{position:fixed;right:16px;top:16px;z-index:10;max-width:310px;background:rgba(15,18,20,.66);color:#e9ecef;padding:12px 14px;border-radius:14px;font-size:12px;line-height:1.4;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)}
    #mobile-controls{display:none;position:fixed;left:14px;bottom:18px;z-index:12;width:116px;height:116px;pointer-events:none;opacity:.82}
    #mobile-controls button{position:absolute;width:46px;height:46px;padding:0;border-radius:50%;font-size:19px;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;background:rgba(12,14,16,.52);border-color:rgba(255,255,255,.16)}
    #move-up{left:35px;top:0}#move-left{left:0;top:35px}#move-right{right:0;top:35px}#move-down{left:35px;bottom:0}
    #look-hint{display:none}
    body.mobile-active #mobile-controls{display:block}
    @media(max-width:700px){
      #hud{left:auto;right:10px;top:10px;gap:6px;max-width:none}
      #hud button{padding:8px 11px;font-size:12px;min-height:38px;background:rgba(12,14,16,.56)}
      #asset-state,#note,#look-hint{display:none!important}
      #status{bottom:10px;font-size:11px;padding:7px 10px;background:rgba(12,14,16,.52)}
      body.mobile-active #status{display:none}
      #mobile-controls{left:12px;bottom:14px}
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <button id="enter" aria-label="Enter walkthrough">Enter walkthrough</button>
    <button id="mode" aria-label="Change view mode">Walking view</button>
    <span id="asset-state" class="pill">loading assets…</span>
  </div>
  <div id="note">Next-generation staging build. Architectural shell, collision and camera pipeline are active. Production GLBs, PBR textures and HDRI assets are still being populated, so this is not the final photoreal presentation.</div>
  <div id="mobile-controls" aria-label="Movement controls">
    <button id="move-up" aria-label="Move forward">▲</button>
    <button id="move-left" aria-label="Move left">◀</button>
    <button id="move-right" aria-label="Move right">▶</button>
    <button id="move-down" aria-label="Move backward">▼</button>
  </div>
  <div id="look-hint">Drag scene to look around</div>
  <div id="status">Initializing…</div>
  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('status');
      if (status) { status.style.display='block'; status.textContent = `Startup error: ${event.message || 'unknown error'}`; }
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('status');
      if (status) { status.style.display='block'; status.textContent = `Startup error: ${event.reason?.message || event.reason || 'unknown error'}`; }
    });
  </script>
  <script type="module" src="./src/nextgen-app-v1.js?v=6"></script>
</body>
</html>
