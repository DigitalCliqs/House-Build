<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101317"><title>Anamarija Design Change Console</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101317;color:#f7f7f4;font-family:Inter,system-ui,sans-serif}body{padding:18px}.wrap{max-width:1100px;margin:auto}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.muted{color:#aeb5bc}.card{margin-top:16px;padding:16px;border-radius:16px;background:#191e24;border:1px solid #2b333c}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}select,input,button,textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid #343d47;background:#11161b;color:#fff;padding:10px;font:inherit}button{cursor:pointer;background:#ece6db;color:#14171a;font-weight:800}.secondary{background:#222a32;color:#fff}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#242d36;margin:3px;font-size:12px}.ok{color:#b8e0ba}.warn{color:#f3d8a6}.small{font-size:12px}.impact-list{display:grid;gap:8px;margin-top:8px}.impact{padding:10px;border-radius:10px;background:#12171c;border:1px solid #28313a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{width:auto}.summary{font-size:14px;line-height:1.55}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.kpi>div{padding:10px;border-radius:10px;background:#12171c;text-align:center}.kpi b{display:block;font-size:20px}@media(max-width:760px){body{padding:10px}.grid,.row{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.top{display:block}.toolbar{margin-top:10px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0 0 6px">Anamarija design change console</h1><div class="muted">Versioned source of truth → impact calculation → selective six-face re-render → QA → publish</div></div><div class="toolbar"><button class="secondary" id="back">Open tour</button><button class="secondary" id="export">Export change set</button></div></div><div class="grid"><section class="card"><h2 style="margin-top:0">Propose a change</h2><label class="small muted">Design object</label><select id="object"></select><div class="row"><div><label class="small muted">Change type</label><select id="kind"><option value="variant">Use variant</option><option value="replace">Replace item / amenity</option><option value="move">Move / resize</option><option value="finish">Change finish</option></select></div><div><label class="small muted">Variant</label><select id="variant"><option value="">No predefined variant</option></select></div></div><label class="small muted" style="display:block;margin-top:10px">Description</label><textarea id="reason" rows="3" placeholder="e.g. Replace main sofa with compact option and move it 400 mm toward media wall"></textarea><div class="row"><button id="analyse">Analyse impact</button><button class="secondary" id="queue">Add to revision queue</button></div><div id="objectInfo" class="summary muted" style="margin-top:10px"></div></section><section class="card"><h2 style="margin-top:0">Current revision</h2><div id="revision" class="summary"></div><div class="kpi"><div><b id="sceneCount">0</b><span class="small muted">dirty scenes</span></div><div><b id="faceCount">0</b><span class="small muted">cube faces</span></div><div><b id="navFlag">No</b><span class="small muted">nav recalc</span></div><div><b id="floorFlag">No</b><span class="small muted">plan update</span></div></div><div id="flags" class="summary" style="margin-top:12px"></div></section></div><section class="card"><h2 style="margin-top:0">Affected render nodes</h2><div id="affected" class="impact-list"><div class="muted">No proposed changes yet.</div></div></section><section class="card"><h2 style="margin-top:0">Revision queue</h2><div id="queueList" class="impact-list"><div class="muted">Queue is empty.</div></div><div class="row"><select id="revKind"><option value="patch">Patch revision</option><option value="minor" selected>Minor revision</option><option value="major">Major revision</option></select><button id="build">Build revision plan</button></div><pre id="plan" style="white-space:pre-wrap;background:#0d1115;padding:12px;border-radius:10px;overflow:auto"></pre></section></div><script type="module">import{DESIGN_META,DESIGN_OBJECTS,VARIANTS}from'./src/house-design-v15.js';import{calculateImpact,combineImpacts,nextRevision}from'./src/change-impact-v15.js';const $=id=>document.getElementById(id);const q=[];for(const [id,o] of Object.entries(DESIGN_OBJECTS)){const opt=document.createElement('option');opt.value=id;opt.textContent=`${o.label} · ${o.type}`;$('object').appendChild(opt)}function sync(){const id=$('object').value,o=DESIGN_OBJECTS[id];$('objectInfo').innerHTML=`<b>${o.label}</b><br>Current: ${o.value}<br>Room: ${o.room} · propagation: ${o.propagation}`;$('variant').innerHTML='<option value="">No predefined variant</option>';for(const [k,v] of Object.entries(VARIANTS[id]||{})){const x=document.createElement('option');x.value=k;x.textContent=`${k}: ${v}`;$('variant').appendChild(x)}}$('object').onchange=sync;sync();$('revision').innerHTML=`Baseline <b>${DESIGN_META.revision}</b><br><span class="muted">${DESIGN_META.baseline}</span>`;function proposed(){return{objectId:$('object').value,reason:$('reason').value||$('kind').value,variant:$('variant').value||null}}function renderImpact(i){$('sceneCount').textContent=i.affectedScenes.length;$('faceCount').textContent=i.requiredCubeFaces.length;$('navFlag').textContent=i.recalcNavigation?'Yes':'No';$('floorFlag').textContent=i.requiresFloorplanUpdate?'Yes':'No';$('flags').innerHTML=`Lighting recalculation: <b>${i.recalcLighting?'required':'not required'}</b> · Accessibility audit: <b>${i.recalcAccessibility?'required':'not required'}</b>`;$('affected').innerHTML=i.affectedScenes.map(s=>`<div class="impact"><b>${s}</b><div class="small muted">6 cube faces: px · nx · py · ny · pz · nz</div></div>`).join('')}$('analyse').onclick=()=>renderImpact(calculateImpact(proposed()));$('queue').onclick=()=>{q.push(proposed());drawQueue();renderCombined()};function drawQueue(){$('queueList').innerHTML=q.length?q.map((c,i)=>`<div class="impact"><b>${DESIGN_OBJECTS[c.objectId].label}</b><div class="small muted">${c.reason}${c.variant?` · variant ${c.variant}`:''}</div></div>`).join(''):'<div class="muted">Queue is empty.</div>'}function renderCombined(){if(!q.length)return;const c=combineImpacts(q);$('sceneCount').textContent=c.scenes.length;$('faceCount').textContent=c.faces.length;$('navFlag').textContent=c.recalcNavigation?'Yes':'No';$('floorFlag').textContent=c.requiresFloorplanUpdate?'Yes':'No';$('flags').innerHTML=`Lighting recalculation: <b>${c.recalcLighting?'required':'not required'}</b> · Accessibility audit: <b>${c.recalcAccessibility?'required':'not required'}</b>`;$('affected').innerHTML=c.scenes.map(s=>`<div class="impact"><b>${s}</b><div class="small muted">Re-render six directional full-HD cube faces</div></div>`).join('')}$('build').onclick=()=>{if(!q.length)return;const c=combineImpacts(q),rev=nextRevision(DESIGN_META.revision,$('revKind').value);$('plan').textContent=JSON.stringify({from:DESIGN_META.revision,to:rev,changes:q,impact:c,workflow:['freeze change set','apply canonical design update','recalculate geometry/navigation/accessibility as flagged','re-render only affected cube faces','visual consistency QA','publish revision','retain rollback snapshot']},null,2)};$('export').onclick=()=>{const data={revision:DESIGN_META.revision,changes:q,impact:q.length?combineImpacts(q):null};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anamarija-change-set.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('back').onclick=()=>location.href='./tour.html?v=15';</script></body></html>
